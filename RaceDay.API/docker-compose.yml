version: '3.4'

services:
  raceday.db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123
    ports:
      - "1433:1433"

  raceday.api:
    image: racedayapi
    build:
      context: .
      dockerfile: RaceDay.API/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=raceday.db;Database=RaceDayDB;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
      - ConnectionStrings__AzureBlobStorage=UseDevelopmentStorage=true
    depends_on:
      - raceday.db

  raceday.mvc:
    image: racedaymvc
    build:
      context: .
      dockerfile: RaceDay.Mvc/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://raceday.api:8080/api/
    depends_on:
      - raceday.api
