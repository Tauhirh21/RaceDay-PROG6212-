name: Validate Docs Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: docs folder is missing"
            exit 1
          fi
          echo "docs folder found."

      - name: Check required files exist
        run: |
          missing=0
          for file in docs/ERD.png docs/API-Endpoint-Plan.md docs/RaceDay-DB-Script.sql; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file not found"
              missing=1
            else
              echo "OK: $file"
            fi
          done
          if [ $missing -eq 1 ]; then
            exit 1
          fi
          echo "All required files present."

      - name: Validate SQL script is not empty
        run: |
          if [ ! -s docs/RaceDay-DB-Script.sql ]; then
            echo "ERROR: SQL script is empty"
            exit 1
          fi
          echo "SQL script has content."