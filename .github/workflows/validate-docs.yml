name: Build, Test, and Validate Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: docs folder is missing"
            exit 1
          fi
          echo "docs folder found."

      - name: Check required files exist
        run: |
          missing=0
          for file in docs/ERD.png docs/API-Endpoint-Plan.md docs/RaceDay-DB-Script.sql; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file not found"
              missing=1
            else
              echo "OK: $file"
            fi
          done
          if [ $missing -eq 1 ]; then
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # IMPORTANT: Change this to 10.0.x if your project targets .NET 10
          dotnet-version: 8.0.x

      - name: Restore API project
        run: dotnet restore RaceDay.API/RaceDay.API.csproj

      - name: Build API project
        run: dotnet build RaceDay.API/RaceDay.API.csproj --no-restore --configuration Release

      - name: Restore Test project
        run: dotnet restore RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      - name: Build Test project
        run: dotnet build RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-build --configuration Release --verbosity normal
